<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Browse and search a personal recipe collection.">

  <title>Recipe Collection</title>

  <link rel="stylesheet" href="site.css">
  <script src="registry.js"></script>
  <script src="app.js" defer></script>
</head>

<body data-page="index">
  <header class="site-header">
    <p class="eyebrow">Recipe Collection</p>
    <h1>Find something good to cook.</h1>
    <p class="intro">
      Search by name, ingredient, cuisine, or cooking style.
    </p>
  </header>

  <main class="page">
    <section class="search-panel" aria-label="Recipe search">
      <div class="search-field">
        <label class="search-label" for="search">Search recipes</label>
        <input
          id="search"
          class="search-input"
          type="search"
          placeholder="Try “ginger”, “soup”, or “make ahead”…"
          autocomplete="off"
        >
      </div>

      <div class="search-tools">
        <p class="result-count" id="result-count" aria-live="polite">
          Loading recipes…
        </p>

        <button class="clear-button" id="clear-filters" type="button">
          Clear filters
        </button>
      </div>
    </section>

    <section
      class="load-notice"
      id="load-notice"
      aria-live="polite"
      hidden
    ></section>

    <section
      class="filters"
      id="filters"
      aria-label="Filter recipes"
    ></section>

    <section
      class="recipes"
      id="recipes"
      aria-live="polite"
    ></section>
  </main>

  <footer class="site-footer">
    Plain HTML, CSS, and JavaScript. No external fonts or services required.
  </footer>
</body>
</html>
