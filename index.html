<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E9;
    --paper-deep:#EDE4D3;
    --ink:#2B2620;
    --rust:#A94A2B;
    --sage:#5C6B4F;
    --line:#D8CBB2;
    --card:#FFFDF8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    padding-bottom:80px;
  }
  header{
    padding:56px 24px 32px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 20% 20%, rgba(169,74,43,0.06), transparent 40%),
      radial-gradient(circle at 80% 0%, rgba(92,107,79,0.08), transparent 45%);
  }
  header .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--rust);
    margin-bottom:10px;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(32px,5vw,52px);
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }
  header p{
    max-width:520px;
    margin:0 auto;
    color:#5b5346;
    font-size:15px;
    line-height:1.5;
  }

  .filterbar{
    max-width:960px;
    margin:24px auto 0;
    padding:0 24px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .filterbar button{
    font-family:'Space Mono',monospace;
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--ink);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  .filterbar button.active{
    background:var(--ink);
    color:var(--paper);
  }

  nav{
    max-width:960px;
    margin:20px auto 0;
    padding:0 24px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  nav button{
    font-family:'Public Sans',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  nav button:hover{ border-color:var(--rust); color:var(--rust); }

  main{
    max-width:760px;
    margin:40px auto;
    padding:0 24px;
    display:flex;
    flex-direction:column;
    gap:56px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    scroll-margin-top:20px;
    overflow:hidden;
  }
  .card-head{
    padding:32px 32px 20px;
    border-bottom:1px dashed var(--line);
  }
  .card-head .tag{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--sage);
  }
  .card-head .collection-badge{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    margin-left:8px;
    vertical-align:middle;
    color:#fff;
  }
  .collection-badge.badge-40days{ background:var(--rust); }
  .collection-badge.badge-okara{ background:var(--sage); }
  .card-head h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:28px;
    margin:6px 0 10px;
  }
  .card-head p{
    margin:0;
    font-size:14.5px;
    line-height:1.55;
    color:#5b5346;
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    padding:18px 32px;
    background:var(--paper-deep);
  }
  .servings{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Mono',monospace;
    font-size:13px;
  }
  .servings button{
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--ink);
    background:var(--card);
    font-size:16px;
    line-height:1;
    cursor:pointer;
  }
  .servings button:hover{ background:var(--rust); color:#fff; border-color:var(--rust); }
  .servings .count{ min-width:64px; text-align:center; }
  .unit-toggle{
    display:flex;
    border:1px solid var(--ink);
    border-radius:999px;
    overflow:hidden;
    font-family:'Space Mono',monospace;
    font-size:12px;
  }
  .unit-toggle button{
    padding:6px 14px;
    border:none;
    background:transparent;
    cursor:pointer;
    color:var(--ink);
  }
  .unit-toggle button.active{
    background:var(--ink);
    color:var(--paper);
  }

  .body{
    display:grid;
    grid-template-columns: 1fr;
    gap:0;
  }
  @media(min-width:600px){
    .body{ grid-template-columns: 1fr 1.4fr; }
  }
  .ingredients{
    padding:28px 32px;
    border-bottom:1px dashed var(--line);
  }
  @media(min-width:600px){
    .ingredients{ border-bottom:none; border-right:1px dashed var(--line); }
  }
  .ingredients h3, .steps h3{
    font-family:'Space Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--rust);
    margin:0 0 14px;
  }
  .ingredients ul{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .ingredients li{
    font-size:14.5px;
    line-height:1.4;
    display:flex;
    gap:8px;
  }
  .ingredients .amt{
    font-family:'Space Mono',monospace;
    font-weight:700;
    white-space:nowrap;
    color:var(--sage);
  }
  .steps{
    padding:28px 32px;
  }
  .steps ol{
    margin:0;
    padding:0;
    list-style:none;
    counter-reset:step;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .steps li{
    counter-increment:step;
    position:relative;
    padding-left:34px;
    font-size:14.5px;
    line-height:1.55;
  }
  .steps li::before{
    content:counter(step);
    position:absolute;
    left:0; top:0;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--rust);
    width:24px;height:24px;
    border:1px solid var(--rust);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .steps h4{
    margin:0 0 3px;
    font-size:14.5px;
    font-weight:700;
  }
  .notes{
    margin:0 32px 28px;
    padding:14px 16px;
    background:var(--paper-deep);
    border-left:3px solid var(--sage);
    font-size:13px;
    line-height:1.5;
    color:#4a4436;
  }
  footer{
    text-align:center;
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:#948a76;
    padding:20px;
  }
  @media print{
    nav, .filterbar, .unit-toggle, .servings button{ display:none; }
    .card{ break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>

</header>
