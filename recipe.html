<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe | Recipe Collection</title>
  <link rel="stylesheet" href="site.css">
</head>

<body data-page="recipe">
  <header class="site-header">
    <a class="brand" href="index.html">Recipe Collection</a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">All recipes</a>
    </nav>
  </header>

  <main class="recipe-page">
    <p class="back-link">
      <a href="index.html">← Back to all recipes</a>
    </p>

    <article id="recipe-detail" class="recipe-detail">
      <p id="recipe-status" class="recipe-status">Loading recipe...</p>

      <header class="recipe-header">
        <p id="recipe-tag" class="recipe-tag"></p>
        <h1 id="recipe-title"></h1>
        <p id="recipe-description" class="recipe-description"></p>
      </header>

      <section class="recipe-controls" aria-label="Recipe controls">
        <div class="servings-control">
          <span class="control-label">Servings</span>
          <button id="servings-decrease" type="button" aria-label="Decrease servings">−</button>
          <span id="servings-count">0</span>
          <button id="servings-increase" type="button" aria-label="Increase servings">+</button>
        </div>

        <div class="unit-control">
          <span class="control-label">Units</span>
          <button id="unit-us" type="button" class="active">US</button>
          <button id="unit-metric" type="button">Metric</button>
        </div>
      </section>

      <div class="recipe-columns">
        <section class="ingredients-section">
          <h2>Ingredients</h2>
          <ul id="recipe-ingredients"></ul>
        </section>

        <section class="steps-section">
          <h2>Instructions</h2>
          <ol id="recipe-steps"></ol>
        </section>
      </div>

      <section id="recipe-notes-section" class="notes-section">
        <h2>Notes</h2>
        <p id="recipe-notes"></p>
      </section>
    </article>
  </main>

  <footer class="site-footer">
    <a href="index.html">Recipe Collection</a>
  </footer>

  <script src="registry.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
