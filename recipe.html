<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe | Recipe Collection</title>
  <link rel="stylesheet" href="site.css">
</head>

<body data-page="recipe">
  <header class="site-header">
    <a class="brand" href="index.html">Recipe Collection</a>

    <nav class="site-nav" aria-label="Primary navigation">
      <a href="index.html">All recipes</a>
    </nav>
  </header>

  <main class="recipe-page">
    <p class="back-link">
      <a href="index.html">← Back to all recipes</a>
    </p>

    <p id="recipe-loading" class="recipe-status">Loading recipe...</p>

    <section id="recipe-missing" class="empty-state" hidden>
      <h1>Recipe unavailable</h1>
      <p id="recipe-missing-message"></p>
      <p><a href="index.html">← Back to all recipes</a></p>
    </section>

    <article id="recipe-detail" class="recipe-detail" hidden>
      <header class="recipe-header">
        <p id="recipe-meta" class="recipe-meta"></p>
        <h1 id="recipe-title"></h1>
        <p id="recipe-description" class="recipe-description"></p>
        <div id="recipe-tags" class="tag-list" aria-label="Recipe tags"></div>
      </header>

      <section class="recipe-controls" aria-label="Recipe controls">
        <div class="servings-control">
          <span class="control-label">Servings</span>
          <button
            id="servings-decrease"
            type="button"
            aria-label="Decrease servings"
          >−</button>
          <span id="servings-count">1 serving</span>
          <button
            id="servings-increase"
            type="button"
            aria-label="Increase servings"
          >+</button>
        </div>

        <div class="unit-control">
          <span class="control-label">Units</span>
          <button
            id="units-us"
            type="button"
            data-unit="us"
            aria-pressed="true"
          >US</button>
          <button
            id="units-metric"
            type="button"
            data-unit="metric"
            aria-pressed="false"
          >Metric</button>
        </div>
      </section>

      <div class="recipe-columns">
        <section class="ingredients-section">
          <h2>Ingredients</h2>
          <ul id="ingredient-list"></ul>
        </section>

        <section class="steps-section">
          <h2>Instructions</h2>
          <ol id="step-list"></ol>
        </section>
      </div>

      <section id="recipe-notes" class="notes-section" hidden>
        <h2>Notes</h2>
        <p id="recipe-notes-text"></p>
      </section>

      <p id="recipe-source" class="recipe-source" hidden></p>
    </article>
  </main>

  <footer class="site-footer">
    <a href="index.html">Recipe Collection</a>
  </footer>

  <script src="registry.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
